<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Driftbound</title>
<meta name="theme-color" content="#0c1026">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow:wght@500;700;800&display=swap" rel="stylesheet">
<script src="shared/config.js"></script>
<script src="shared/gate.js"></script>
<link rel="stylesheet" href="home.css">
</head>
<body>
<noscript><p style="color:#f5efe2;text-align:center;padding:40px 16px">Driftbound is for adults only and needs JavaScript switched on.</p></noscript>
<template id="page">
  <header class="topbar">
    <div class="topbar-row">
      <a class="logo" href="#top">DRIFTBOUND</a>
      <div class="salvage">Salvage <b id="total">0</b></div>
    </div>
    <div class="nav-wrap">
      <nav class="nav" aria-label="Sections">
        <a href="#games">Games</a><a href="#crew-section">Crew</a><a href="#story">Story</a><a href="#videos">Videos</a><a href="#book">Book</a>
      </nav>
    </div>
  </header>

  <main id="top">
    <section class="hero">
      <img class="hero-art" src="art/site/banner-v1-web.webp" width="1600" height="800" alt="Kaito sprints along a cliff edge at dusk with lightning around his arm, while his storm wolf Skarn glides above him. Floating islands drift behind them.">
      <div class="hero-slant" aria-hidden="true"></div>
      <div class="hero-text">
        <h1 class="hero-title">DRIFTBOUND</h1>
        <div class="hero-pitch">
          <p class="tagline">The islands move. The maps lie. A salvage crew and their monster partners run from an Empire that wants the Drift pinned down.</p>
          <a class="btn" href="#games">Enter the Drift</a>
        </div>
      </div>
    </section>

    <section class="section" id="games">
      <div class="inner">
        <h2 class="section-title">GAMES</h2>
        <div class="games" id="game-grid"></div>
        <div class="next-island"><span class="tag soon">COMING SOON</span>More islands, more games</div>
      </div>
    </section>

    <section class="section" id="crew-section">
      <div class="inner">
        <h2 class="section-title">THE CREW OF THE GULLWAKE</h2>
        <div class="crew" id="crew"></div>
      </div>
    </section>

    <section class="section" id="story">
      <div class="inner">
        <h2 class="section-title">STORY CARDS</h2><span class="book-count" id="story-count"></span>
        <p class="section-note">Salvage from any game opens these. Spending it never closes one again.</p>
        <div class="stories" id="story-grid"></div>
      </div>
    </section>

    <section class="section">
      <div class="inner soon-pair">
        <div id="novel" class="soon-card soon-story">
          <span class="tag soon">COMING SOON</span>
          <h3>Visual novel</h3>
          <p>The crew's story, with romance routes.</p>
        </div>
        <div id="videos" class="soon-card soon-video">
          <span class="tag soon">COMING SOON</span>
          <h3>Videos</h3>
          <p>Short anime stories from the Drift.</p>
        </div>
      </div>
    </section>

    <section class="section" id="book">
      <div class="inner">
        <h2 class="section-title">MONSTER BOOK</h2><span class="book-count" id="book-count"></span>
        <p class="section-note">Every game hides two pals. Catch one and it stays here for good.</p>
        <div class="book" id="book-grid"></div>
        <div class="pal-notes" id="pal-notes"></div>
      </div>
    </section>
  </main>

  <footer>Driftbound · adults only · original characters · progress is saved in this browser</footer>
</template>
<script src="shared/save.js"></script>
<script src="shared/crew.js"></script>
<script src="shared/games.js"></script>
<script src="shared/pals.js"></script>
<script src="shared/stories.js"></script>
<script src="hub.js"></script>
<script src="hub-book.js"></script>
</body>
</html>
