# GitHub Pages settings. Keeps the v1 code off the public site (Dylan 2026-11-05: "Move, keep off the public site").
# It stays in the repo, word for word. The old game is still playable at dygoma.github.io/hoshi-arcade/.
# The Markdown lines: Pages turns any .md file into a page with no 18+ gate. The logged exception covers sheets and docs only (DECISIONS.md),
# so a game's notes and the kit's guide stay off the site. The * patterns also catch each later game's files.
exclude:
  - archive
  - tools
  - README.md
  - shared/kit/README.md
  - games/*/NOTES.md
  - games/*/art/REQUEST.md
  # Any other .md in a game's folder: old notes kept word for word (NOTES-before-review-3.md, NOTES-archive.md) are notes too.
  - games/*/*.md
  # Working files the site never loads: image prompts and raw art. Each would otherwise sit at its own address with no gate.
  # (art/refs/ stays published: that's the logged exception for sheets.)
  - games/*/art/prompts
  - games/*/art/raw
  - art/site/prompts
  - art/site/crew/*-raw.png
  - docs/manga   # the manga bible holds every spoiler and would publish with no 18+ gate
  - anime/episodes   # episode scripts are Markdown with no 18+ gate. (Plain "anime" also hid anime.html: Jekyll matches excludes by prefix.)
