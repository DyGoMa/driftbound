<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hoshi Arcade</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  :root { --bg: #120c33; --panel: #1f1650; --panel2: #2a1d66; --ink: #1d1430; --text: #f4efff; --muted: #b9addf;
          --pink: #ff7aa8; --gold: #ffd75e; --orange: #ff8c2e; --teal: #2ec4b6; }
  * { box-sizing: border-box; }
  html { background: var(--bg); }
  body { margin: 0; min-height: 100vh; background: radial-gradient(ellipse 120% 700px at top, #3b1e6e 0%, var(--bg) 100%) no-repeat, var(--bg); color: var(--text);
         font-family: "M PLUS Rounded 1c", system-ui, sans-serif; }
  .wrap { max-width: 1040px; margin: 0 auto; padding: 0 16px 48px; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 0; }
  .logo { font-weight: 900; font-size: 26px; letter-spacing: 1px; color: var(--gold); text-shadow: 3px 3px 0 var(--ink), 0 0 18px rgba(255,122,168,.6); }
  .logo span { color: var(--pink); }
  .pill { background: var(--panel); border: 2px solid var(--gold); border-radius: 999px; padding: 6px 14px; font-weight: 900; white-space: nowrap; }
  .hero { position: relative; border-radius: 18px; overflow: hidden; border: 3px solid var(--pink); background: var(--panel); }
  .hero canvas { display: block; width: 100%; height: 240px; }
  .hero .cta { position: absolute; left: 16px; bottom: 16px; right: 16px; display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 10px; }
  .hero h2 { margin: 0; font-size: 30px; font-weight: 900; color: var(--orange); text-shadow: 3px 3px 0 var(--ink); }
  .hero p { margin: 2px 0 0; font-weight: 700; text-shadow: 2px 2px 0 var(--ink); max-width: 420px; }
  @media (max-width: 600px) {
    .logo { font-size: 20px; } .pill { font-size: 13px; padding: 5px 10px; }
    .hero canvas { height: 200px; }
    .hero .cta { position: static; padding: 12px 14px 14px; }
  }
  .btn { display: inline-block; background: var(--gold); color: var(--ink); font-weight: 900; font-size: 18px; padding: 10px 22px;
         border-radius: 999px; text-decoration: none; box-shadow: 0 4px 0 #b8892b; }
  .btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #b8892b; }
  h3 { font-size: 20px; font-weight: 900; margin: 28px 0 10px; color: var(--pink); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
  .card { background: var(--panel); border: 2px solid var(--panel2); border-radius: 14px; overflow: hidden; color: inherit; text-decoration: none; display: block; }
  a.card:hover { border-color: var(--gold); transform: translateY(-2px); }
  .card canvas { display: block; width: 100%; aspect-ratio: 4 / 3; background: #2a1652; }
  .card .info { padding: 8px 10px 10px; }
  .card b { display: block; font-size: 15px; }
  .card small { color: var(--muted); font-weight: 500; }
  .tag { display: inline-block; font-size: 11px; font-weight: 900; padding: 1px 8px; border-radius: 999px; margin-top: 4px; }
  .tag.live { background: var(--teal); color: var(--ink); } .tag.soon { background: #4a3a80; color: var(--muted); }
  .locked canvas { filter: grayscale(.7) brightness(.55); }
  .cast .card canvas { aspect-ratio: 1; }
  .lore { display: grid; gap: 10px; }
  .lore div { background: var(--panel); border-left: 5px solid var(--gold); border-radius: 10px; padding: 10px 12px; }
  .lore div.lock { border-left-color: #4a3a80; color: var(--muted); }
  .lore b { display: block; }
  footer { margin-top: 32px; color: var(--muted); font-size: 13px; text-align: center; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">HOSHI<span>★</span>ARCADE</div>
    <div class="pill" id="total">★ 0 Star Shards</div>
  </header>

  <section class="hero">
    <canvas id="banner"></canvas>
    <div class="cta">
      <div><h2>Aki Dash</h2><p>The Static is eating the arcade. Run, jump twice, and grab every Star Shard you can.</p></div>
      <a class="btn" href="games/aki-dash/index.html">Play now ▶</a>
    </div>
  </section>

  <h3>Cabinets</h3>
  <div class="grid" id="cabinets"></div>

  <h3>The Crew</h3>
  <div class="grid cast" id="cast"></div>

  <h3>Arcade Stories <small style="color:var(--muted);font-weight:500">(collect shards in any game to unlock)</small></h3>
  <div class="lore" id="lore"></div>

  <footer>Hoshi Arcade · every game, one world · progress is saved in this browser</footer>
</div>
<script src="shared/cast.js"></script>
<script src="shared/save.js"></script>
<script src="hub.js"></script>
</body>
</html>
